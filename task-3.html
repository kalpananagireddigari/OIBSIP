<!DOCTYPE html>
<html>
<head>
  <title>Temperature Converter</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(to right, #74ebd5, #9face6);
      text-align: center;
      margin-top: 100px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      margin: auto;
      box-shadow: 0 0 10px gray;
    }

    input {
      padding: 10px;
      width: 80%;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #555;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Temperature Converter</h2>

    <input type="number" id="temp" placeholder="Enter Celsius">

    <br>

    <button onclick="convert()">Convert to Fahrenheit</button>

    <p id="result"></p>
  </div>

  <script>
    function convert() {
      let c = document.getElementById("temp").value;

      if (c === "") {
        document.getElementById("result").innerText = "Please enter a value";
        return;
      }

      let f = (c * 9/5) + 32;

      document.getElementById("result").innerText =
        "Fahrenheit: " + f.toFixed(2);
    }
  </script>

</body>
</html>
