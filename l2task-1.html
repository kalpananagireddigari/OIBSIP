<!DOCTYPE html>
<html>
<head>
  <title>Simple Calculator</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
      background: linear-gradient(to right, #89f7fe, #66a6ff);
    }

    .container {
      background: white;
      padding: 30px;
      width: 300px;
      margin: auto;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    input {
      padding: 10px;
      margin: 10px;
      width: 80%;
    }

    button {
      padding: 10px;
      margin: 5px;
      width: 60px;
      border: none;
      background: #333;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #res {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Calculator</h2>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <br>

    <button onclick="add()">+</button>
    <button onclick="sub()">-</button>
    <button onclick="mul()">×</button>
    <button onclick="div()">÷</button>

    <p id="res"></p>
  </div>

  <script>
    function add() {
      let a = Number(num1.value);
      let b = Number(num2.value);
      res.innerText = "Result: " + (a + b);
    }

    function sub() {
      let a = Number(num1.value);
      let b = Number(num2.value);
      res.innerText = "Result: " + (a - b);
    }

    function mul() {
      let a = Number(num1.value);
      let b = Number(num2.value);
      res.innerText = "Result: " + (a * b);
    }

    function div() {
      let a = Number(num1.value);
      let b = Number(num2.value);

      if (b === 0) {
        res.innerText = "Cannot divide by zero";
      } else {
        res.innerText = "Result: " + (a / b);
      }
    }
  </script>

</body>
</html>
