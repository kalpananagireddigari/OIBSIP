<!DOCTYPE html>
<html>
<head>
  <title>Pizza Delivery App</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #e63946;
      color: white;
      text-align: center;
      padding: 15px;
    }

    .container {
      display: flex;
      justify-content: space-around;
      margin: 20px;
    }

    .menu, .cart {
      background: white;
      padding: 20px;
      width: 40%;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }

    h2 {
      text-align: center;
    }

    .item {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      padding: 10px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    button {
      padding: 5px 10px;
      background: #333;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #555;
    }

    #total {
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>🍕 Pizza Delivery App</h1>
</header>

<div class="container">

  <!-- MENU -->
  <div class="menu">
    <h2>Menu</h2>

    <div class="item">
      <span>Margherita - ₹200</span>
      <button onclick="addToCart('Margherita',200)">Add</button>
    </div>

    <div class="item">
      <span>Farmhouse - ₹300</span>
      <button onclick="addToCart('Farmhouse',300)">Add</button>
    </div>

    <div class="item">
      <span>Peppy Paneer - ₹350</span>
      <button onclick="addToCart('Peppy Paneer',350)">Add</button>
    </div>

    <div class="item">
      <span>Veg Extravaganza - ₹400</span>
      <button onclick="addToCart('Veg Extravaganza',400)">Add</button>
    </div>

  </div>

  <!-- CART -->
  <div class="cart">
    <h2>Cart</h2>

    <ul id="cartList"></ul>

    <p id="total">Total: ₹0</p>
  </div>

</div>

<script>
  let total = 0;

  function addToCart(name, price) {
    let li = document.createElement("li");

    li.innerHTML = name + " - ₹" + price + 
      " <button onclick='removeItem(this," + price + ")'>X</button>";

    document.getElementById("cartList").appendChild(li);

    total += price;
    updateTotal();
  }

  function removeItem(btn, price) {
    btn.parentElement.remove();
    total -= price;
    updateTotal();
  }

  function updateTotal() {
    document.getElementById("total").innerText = "Total: ₹" + total;
  }
</script>

</body>
</html>
